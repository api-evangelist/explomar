aid: explomar
name: Explomar
description: 'ExploMar (Changshu, China) designs and manufactures high-power fully-electric
  outboard propulsion systems for boats, ranging from 70HP to 1200HP. Its product line
  spans lightweight axial-flux electric outboard motors, high-density marine batteries
  for long-range and wide-temperature operation, the Smart Captain integrated control
  system with 200+ diagnostic capabilities, and 5S energy/charging stations (7kW portable
  through 120kW dual-gun). ExploMar markets an eco-friendly, high-performance alternative
  to combustion marine propulsion and exhibits at international yachting festivals
  (Cannes, Monaco, Interboot, Polboat). Backed by DCM Ventures; surfaced in the API
  Evangelist network as a portfolio company. Note: ExploMar is a marine hardware
  manufacturer and publishes no public developer API, documentation, or SDKs at this
  time — this profile carries identity and web-property signals only.'
